# MotionSense configuration. Every key is optional; omitted keys use built-in defaults.
# Any value can also be overridden with environment variables, e.g.
#   MOTIONSENSE_CAMERA__SOURCE=1   MOTIONSENSE_API__TOKEN=secret

camera:
  source: "0"            # 0 = first webcam | path/to/video.mp4 | rtsp://... | http://phone-ip:8080/video | synthetic:demo
  width: 1280
  height: 720
  fps: 30
  camera_id: cam0

models:
  pose_model: yolo26s-pose   # best accuracy/speed on an Intel iGPU; use yolo26n-pose on CPU-only machines
  object_model: yolo26s      # yolo26n = faster, but more false objects
  runtime: openvino          # openvino (fast on Intel CPUs/iGPUs) | torch
  device: auto               # auto (Intel iGPU if available, else CPU) | cpu | intel:gpu | cuda:0
  imgsz: 640                 # 480 or 416 = faster, slightly less accurate for far-away people
  pose_conf: 0.4             # confidence needed to start tracking a new person
  tracker: motionsense       # tuned ByteTrack (keeps ids stable through short dropouts)
  object_conf: 0.5

objects:
  enabled: true
  interval_s: 0.5            # furniture does not move: detect objects twice a second
  support_classes: [bed, couch, chair, bench, toilet]

activity:
  ema_tau_s: 0.45            # smoothing of the percentages
  change_hold_s: 1.0         # an activity must hold this long before an "activity_changed" event

fall:
  drop_threshold: 0.7        # hip drop within 1 s, in torso lengths (tuned on UR Fall)
  tilt_change_threshold: 40  # torso rotation within 1.5 s, degrees
  velocity_threshold: 1.3    # peak downward hip speed, torso lengths per second
  impact_score_threshold: 0.5
  confirm_s: 2.0             # must stay down this long after the impact to confirm a fall
  recover_hold_s: 1.0
  inactive_alert_s: 30       # escalate if the person is still down this long after a fall
  furniture_factor: 0.35     # landing on a bed/couch multiplies confidence by this
  cooldown_s: 3.0
  track_lost_s: 1.5
  emit_suspected: true

api:
  host: 127.0.0.1            # 0.0.0.0 to allow phones/other PCs on your LAN (set a token!)
  port: 8000
  token: null
  state_hz: 10
  stream_fps: 15
  jpeg_quality: 75

sinks:
  jsonl: true                # <data_dir>/events.jsonl
  snapshots: true            # <data_dir>/events/<event-id>/*.jpg for warning/critical events
  snapshot_pre_s: 2.0
  snapshot_post_s: 3.0
  snapshot_hz: 3.0
  snapshot_max_events: 100   # oldest incident folders are deleted beyond this
  webhooks: []               # e.g. ["http://localhost:5678/webhook/fall"]
  webhook_min_severity: warning
