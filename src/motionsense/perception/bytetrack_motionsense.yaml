# ByteTrack tuned for people tracking in a room (Ultralytics tracker config format).
# Low-confidence detections (e.g. someone lying on the floor, or partly out of view) keep an
# existing track alive instead of starting a new one, and lost tracks survive short dropouts.
tracker_type: bytetrack
track_high_thresh: 0.3 # first-stage association
track_low_thresh: 0.1 # second-stage association with low-score boxes (keeps tracks alive)
new_track_thresh: 0.4 # only confident detections may start a new person track
track_buffer: 60 # frames a lost track is kept (2 s at 30 FPS, longer at lower FPS)
match_thresh: 0.8
fuse_score: True
