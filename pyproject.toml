[project]
name = "motionsense"
version = "0.1.0"
description = "Real-time, camera-based human activity recognition and fall detection with a pluggable event API."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11,<3.14"
authors = [{ name = "MotionSense contributors" }]
keywords = ["fall-detection", "pose-estimation", "activity-recognition", "yolo", "computer-vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
yolo = [
    "ultralytics>=8.3",
    "lap>=0.5",
    "openvino>=2024.4",
]

[project.scripts]
motionsense = "motionsense.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motionsense"]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "camera: requires a physical camera",
    "model: requires downloading YOLO model weights",
]

[tool.coverage.run]
source = ["motionsense"]
omit = [
    "src/motionsense/perception/yolo_*.py",
    "src/motionsense/perception/model_manager.py",
    "src/motionsense/tools/bench.py",
    "src/motionsense/cli.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]  # line length is handled by the formatter

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = false
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
